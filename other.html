<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swarm Sign · Samuel Campbell</title>
  <meta name="description" content="A sign written by a swarm: it shows the time, or any message you type, built pixel by pixel by samurai, robots, wizards and ninjas.">
  <meta name="theme-color" content="#050806">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    /* Swarm Sign: a 59 x 15 board of pixels. The page works out which pixels the text needs; the swarm (swarm-intro
       puppets, every mode's figures) builds the missing ones and takes apart the ones that shouldn't be lit. */
    html, body { height: 100%; overflow: hidden; }
    body.sign { display: flex; flex-direction: column; font-size: 13px; }
    .s-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 18px 6px; position: relative; z-index: 2; }
    .s-top h1 { margin: 0 8px 0 0; font-size: 18px; letter-spacing: .14em; color: var(--hi); }
    .s-top .links { margin-left: auto; display: flex; gap: 14px; } .s-top a { color: var(--dim); }
    .sign button { font: inherit; color: var(--text); background: rgb(5 8 6 / .7); border: 1px solid rgb(255 255 255 / .18); border-radius: 3px; padding: 4px 10px; min-height: 30px; cursor: pointer; }
    .sign button:hover, .sign button.on { border-color: var(--accent); color: var(--accent); }
    #say { font: inherit; color: var(--hi); background: rgb(5 8 6 / .7); border: 1px solid rgb(57 255 122 / .45); border-radius: 3px; padding: 4px 10px; min-height: 30px; width: 24ch; text-transform: uppercase; letter-spacing: .08em; }
    #say:focus { outline: 1px solid var(--accent); outline-offset: 2px; }
    #status { margin: 0; padding: 0 18px 6px; color: var(--dim); position: relative; z-index: 2; min-height: 1.6em; }
    #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px 28px 90px; position: relative; z-index: 1; }
    #board { display: grid; grid-template-columns: repeat(59, 1fr); gap: 3px; width: min(100%, calc((100vh - 230px) * 59 / 15)); aspect-ratio: 59 / 15; }
    .px { min-width: 0; min-height: 0; display: flex; border: 1px solid rgb(57 255 122 / .07); }
    .dot { flex: 1; background: #39FF7A; box-shadow: 0 0 9px rgb(57 255 122 / .65), inset 0 0 3px #EAFFE7; transition: opacity .25s; }
    .line2 .dot { background: #FFE27A; box-shadow: 0 0 9px rgb(255 226 122 / .6), inset 0 0 3px #fff; }
    .sign .swarm-intro-cursor, .sign .swarm-intro-box { --swarm-intro-fg: #C8F7C5; }
    .sign .swarm-intro-cursor[data-kind="cursor"] { filter: drop-shadow(0 0 4px var(--swarm-intro-fg)); }
    .sign .swarm-intro-badge { display: none; }
    @media (max-width: 900px) { #stage { padding: 6px 6px 70px; } #board { gap: 1px; width: 100%; } #say { width: 16ch; } }
  </style>
</head>
<body class="sign war">
  <canvas id="matrix" class="matrix" aria-hidden="true"></canvas>
  <header class="s-top">
    <h1>SWARM SIGN</h1>
    <input id="say" type="text" maxlength="20" placeholder="type a message" aria-label="Message for the swarm to write, up to 20 characters" autocomplete="off" spellcheck="false">
    <button type="button" id="write">write it</button>
    <button type="button" id="clock">clock</button>
    <button type="button" id="copy">copy link</button>
    <span class="links"><a href="fight_game.html">game →</a><a href="music.html">music →</a><a href="./">← résumé</a></span>
  </header>
  <p id="status" aria-live="polite"></p>
  <main id="stage"><div id="board" role="img" aria-label="The sign"></div></main>

  <script>window.MODE = "normal"; window.MOTION = !matchMedia("(prefers-reduced-motion: reduce)").matches;</script>
  <script src="assets/matrix.js"></script>
  <script src="assets/swarm-intro.js"></script>
  <script src="assets/samurai.js"></script>
  <script src="assets/robot.js"></script>
  <script src="assets/wizard.js"></script>
  <script src="assets/ninja.js"></script>
  <script>
    (function () {
      // a 5 x 7 pixel font: each glyph is 7 rows of 5 bits
      var F = {
        A: "01110 10001 10001 11111 10001 10001 10001", B: "11110 10001 10001 11110 10001 10001 11110", C: "01110 10001 10000 10000 10000 10001 01110",
        D: "11110 10001 10001 10001 10001 10001 11110", E: "11111 10000 10000 11110 10000 10000 11111", F: "11111 10000 10000 11110 10000 10000 10000",
        G: "01110 10001 10000 10111 10001 10001 01111", H: "10001 10001 10001 11111 10001 10001 10001", I: "01110 00100 00100 00100 00100 00100 01110",
        J: "00111 00010 00010 00010 00010 10010 01100", K: "10001 10010 10100 11000 10100 10010 10001", L: "10000 10000 10000 10000 10000 10000 11111",
        M: "10001 11011 10101 10101 10001 10001 10001", N: "10001 11001 10101 10011 10001 10001 10001", O: "01110 10001 10001 10001 10001 10001 01110",
        P: "11110 10001 10001 11110 10000 10000 10000", Q: "01110 10001 10001 10001 10101 10010 01101", R: "11110 10001 10001 11110 10100 10010 10001",
        S: "01111 10000 10000 01110 00001 00001 11110", T: "11111 00100 00100 00100 00100 00100 00100", U: "10001 10001 10001 10001 10001 10001 01110",
        V: "10001 10001 10001 10001 10001 01010 00100", W: "10001 10001 10001 10101 10101 11011 10001", X: "10001 10001 01010 00100 01010 10001 10001",
        Y: "10001 10001 01010 00100 00100 00100 00100", Z: "11111 00001 00010 00100 01000 10000 11111",
        0: "01110 10001 10011 10101 11001 10001 01110", 1: "00100 01100 00100 00100 00100 00100 01110", 2: "01110 10001 00001 00010 00100 01000 11111",
        3: "11110 00001 00001 01110 00001 00001 11110", 4: "00010 00110 01010 10010 11111 00010 00010", 5: "11111 10000 11110 00001 00001 10001 01110",
        6: "00110 01000 10000 11110 10001 10001 01110", 7: "11111 00001 00010 00100 01000 01000 01000", 8: "01110 10001 10001 01110 10001 10001 01110",
        9: "01110 10001 10001 01111 00001 00010 01100", ":": "00000 00100 00100 00000 00100 00100 00000", ".": "00000 00000 00000 00000 00000 00110 00110",
        "!": "00100 00100 00100 00100 00100 00000 00100", "?": "01110 10001 00001 00010 00100 00000 00100", "-": "00000 00000 00000 11111 00000 00000 00000",
        "'": "00100 00100 01000 00000 00000 00000 00000", ",": "00000 00000 00000 00000 00110 00100 01000", "/": "00001 00001 00010 00100 01000 10000 10000",
        "+": "00000 00100 00100 11111 00100 00100 00000", "*": "00000 01010 11111 11111 01110 00100 00000", " ": "00000 00000 00000 00000 00000 00000 00000"
      };
      var COLS = 59, ROWS = 15, PER = 10, $ = function (id) { return document.getElementById(id); }, board = $("board");
      var dots = [], want = [];
      for (var r = 0; r < ROWS; r++) {
        dots.push([]); want.push(new Uint8Array(COLS));
        for (var c = 0; c < COLS; c++) {
          var px = document.createElement("div"); px.className = "px" + (r > 7 ? " line2" : "");
          var d = document.createElement("div"); d.className = "dot"; d._r = r; d._c = c;
          px.appendChild(d); board.appendChild(px); dots[r].push(d);
        }
      }
      function lit(d) { return !d.hasAttribute("data-swarm-intro-pending"); }
      // text -> up to two lines of ten characters (split at a space when there is one), each centred
      function clean(t) { return (t || "").toUpperCase().replace(/[♥❤]/g, "*").split("").map(function (ch) { return F[ch] ? ch : " "; }).join("").replace(/\s+/g, " ").trim().slice(0, 20); }
      function lines(t) {
        if (t.length <= PER) return [t, ""];
        var cut = t.lastIndexOf(" ", PER); if (cut < 1 || t.length - cut - 1 > PER) cut = -1;
        return cut > 0 ? [t.slice(0, cut), t.slice(cut + 1)] : [t.slice(0, PER), t.slice(PER).trim()];
      }
      function render(t) {
        var ls = lines(t);
        for (var r = 0; r < ROWS; r++) want[r].fill(0);
        ls.forEach(function (line, li) {
          var x0 = Math.floor((COLS - (line.length * 6 - 1)) / 2), y0 = li * 8;
          line.split("").forEach(function (ch, i) {
            F[ch].split(" ").forEach(function (bits, y) { for (var x = 0; x < 5; x++) if (bits[x] === "1") want[y0 + y][x0 + i * 6 + x] = 1; });
          });
        });
        if (!MOTION) dots.forEach(function (row, r) { row.forEach(function (d, c) { want[r][c] ? d.removeAttribute("data-swarm-intro-pending") : d.setAttribute("data-swarm-intro-pending", ""); }); });
      }

      // ---------- the swarm: puppets that fix whatever differs between the board and the text ----------
      samuraiMode({ scoped: true }); robotMode({ scoped: true }); wizardMode({ scoped: true }); ninjaMode({ scoped: true });
      var N = 24, KINDS = ["samurai", "robot", "wizard", "ninja", "cursor"], fast = { speed: 2 };
      var swarm = swarmIntro({ root: "#board", targets: ".dot", logo: false, cursors: 0, skipButton: false, respectReducedMotion: false,
        persist: true, puppet: true, type: false,
        traits: { cursor: fast, samurai: fast, robot: fast, wizard: fast, ninja: fast },
        buildPause: function (a) { return a.kind === "samurai" ? 150 : 0; },
        revealPause: function (a) { return a.kind === "samurai" ? 260 : 0; },
        // nothing to fix: line up under the sign and rest (each mode's idle pose)
        idle: function (a, now) {
          var b = board.getBoundingClientRect();
          a.el.dataset.rest = now; a.el.dataset.face = a.n < N / 2 ? 1 : -1;
          return { x: b.left + (a.n + .5) / N * b.width, y: Math.min(innerHeight - 14, b.bottom + (a.n % 2 ? 44 : 70)), ms: 500, wait: 160 };
        } });
      if (MOTION) for (var i = 0; i < N; i++) {
        var a = swarm.add({ kind: KINDS[i % KINDS.length], team: "g", x: i % 2 ? -24 : innerWidth + 24, y: Math.random() * innerHeight });
        if (a) a.n = i;
      }
      new MutationObserver(function (ms) { ms.forEach(function (m) { m.target._busy = 0; }); }).observe(board, { subtree: true, attributes: true, attributeFilter: ["data-swarm-intro-pending"] });
      // every moment: each free unit takes the nearest pixel that's wrong
      setInterval(function () {
        var now = performance.now(), free = swarm.units().filter(function (a) { return !a.working && !a.job; });
        if (!free.length) return;
        var todo = [];
        for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) { var d = dots[r][c]; if (!!want[r][c] !== lit(d) && !(d._busy > now)) todo.push(d); }
        if (!todo.length) return;
        var b = board.getBoundingClientRect(), cw = b.width / COLS, ch = b.height / ROWS;
        free.forEach(function (a) {
          if (!todo.length) return;
          var m = /matrix\(([^)]+)\)/.exec(getComputedStyle(a.el).transform), p = m ? m[1].split(",") : [0, 0, 0, 0, a.x, a.y];
          var best = 0, bd = 1e9;
          for (var i = 0; i < todo.length; i++) { var d = todo[i], dist = Math.hypot(b.left + d._c * cw - p[4], b.top + d._r * ch - p[5]); if (dist < bd) { bd = dist; best = i; } }
          var dot = todo.splice(best, 1)[0];
          if (swarm.order(a, dot, want[dot._r][dot._c] ? "build" : "unbuild")) dot._busy = now + 6000;
        });
      }, 120);

      // ---------- what the sign says: the time, or your message (?say=...) ----------
      var DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"], MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      var message = "", shown = null;
      function two(n) { return (n < 10 ? "0" : "") + n; }
      function timeText() { var d = new Date(); return two(d.getHours()) + ":" + two(d.getMinutes()) + " " + DAYS[d.getDay()] + " " + two(d.getDate()) + " " + MONTHS[d.getMonth()]; }   // "16:17" / "TUE 24 NOV"
      function update() { var t = message || timeText(); if (t !== shown) { shown = t; render(t); } }
      function set(msg, fromUrl) {
        message = clean(msg); $("say").value = message; $("clock").classList.toggle("on", !message);
        if (!fromUrl) history.replaceState(null, "", location.pathname + (message ? "?say=" + encodeURIComponent(message).replace(/%20/g, "+") : ""));
        $("status").textContent = message ? "the swarm is writing your message · \"copy link\" shares it · \"clock\" goes back to the time"
          : "showing the time · type a message (letters, numbers and . , : ! ? ' - + / *) and press Enter";
        update();
      }
      $("write").onclick = function () { set($("say").value); };
      $("say").onkeydown = function (e) { if (e.key === "Enter") set($("say").value); };
      $("clock").onclick = function () { set(""); };
      $("copy").onclick = function () {
        var done = function () { $("copy").textContent = "copied"; setTimeout(function () { $("copy").textContent = "copy link"; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(done, function () { $("status").textContent = location.href; });
        else $("status").textContent = location.href;
      };
      set(new URLSearchParams(location.search).get("say") || "", true);
      setInterval(update, 1000);
      window.__sign = { swarm: swarm, set: set, wrong: function () { var n = 0; for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (!!want[r][c] !== lit(dots[r][c])) n++; return n; },
        text: function () { return dots.map(function (row) { return row.map(function (d) { return lit(d) ? "#" : "."; }).join(""); }).join("\n"); } };
    })();
  </script>
</body>
</html>
