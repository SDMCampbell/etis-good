<!DOCTYPE html>
<!-- Renders assets/og.png (1200x630 share card) from live data. Regenerate with a headless browser screenshot. -->
<html lang="en"><head><meta charset="utf-8"><title>og card</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@600&family=Martian+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#FFF7E8;color:#1C1838;font-family:"Instrument Sans",system-ui,sans-serif;position:relative}
  .frame{position:absolute;inset:22px;border:6px solid #1C1838;box-shadow:12px 12px 0 #FF4A1C;background:#FFF7E8;overflow:hidden}
  svg.topo{position:absolute;inset:0;width:100%;height:100%}
  svg.topo path{fill:none;stroke:#EAD9B6;stroke-width:2}
  .txt{position:absolute;left:56px;top:54px;width:640px}
  .k{font:600 17px "Martian Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#5B5577;margin:0 0 16px}
  h1{font:800 112px/0.88 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.04em;margin:0 0 22px}
  .r{font:800 30px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
  .r span{background:#FFBE0B;padding:0 6px}
  .s{font:600 18px "Martian Mono",monospace;text-transform:uppercase;letter-spacing:.05em;margin:26px 0 0}
  svg.route{position:absolute;right:40px;top:30px;width:400px;height:520px;overflow:visible}
  .url{position:absolute;left:56px;bottom:40px;font:600 18px "Martian Mono",monospace;background:#1C1838;color:#FFF7E8;padding:6px 12px}
</style></head><body>
<div class="frame">
  <svg class="topo" viewBox="0 0 1150 580" preserveAspectRatio="xMidYMid slice"><g id="topo"></g></svg>
  <div class="txt"><p class="k" id="k"></p><h1 id="n"></h1><p class="r" id="r"></p><p class="s" id="s"></p></div>
  <svg class="route" viewBox="0 0 300 600" id="route"></svg>
  <div class="url" id="u"></div>
</div>
<script src="../assets/resume-data.js"></script>
<script src="../assets/derive.js"></script>
<script>
  var R = RESUME, D = DERIVED, C = ["#FF4A1C","#FFBE0B","#00A6A6","#7A4DFF","#FF5FA2","#3BAA5C"];
  document.getElementById("k").textContent = "Route: " + R.tagline.replace(/\.$/, "");
  document.getElementById("n").innerHTML = R.name.replace(" ", "<br>");
  document.getElementById("r").innerHTML = "<span>" + R.title + "</span><br>at " + D.current.company;
  document.getElementById("s").textContent = D.yearsIn + "+ yrs · " + D.roleCount + " roles · " + D.skillCount + " skills · " + R.location;
  document.getElementById("u").textContent = "etis-good.samueldcampbell.workers.dev";
  var t = ""; for (var k = 1; k < 9; k++) t += '<ellipse cx="900" cy="140" rx="' + k * 70 + '" ry="' + k * 48 + '"/>';
  document.getElementById("topo").innerHTML = t.replace(/ellipse/g, "ellipse style=\"fill:none;stroke:#EAD9B6;stroke-width:2\"");
  var jobs = D.chrono, max = jobs[jobs.length - 1]._cum, pts = jobs.map(function (j, i) { return [80 + ((j._t0 - D.firstYear) / (D.nowT - D.firstYear)) * 140 + (i % 2 ? 46 : -46), 560 - j._cum / max * 500]; });
  for (var i = pts.length - 2; i >= 0; i--) if (pts[i][1] - pts[i + 1][1] < 44) pts[i][1] = pts[i + 1][1] + 44;
  var d = "M" + (pts[0][0] - 30) + " 590 " + pts.map(function (p) { return "L" + p[0] + " " + p[1]; }).join(" ");
  var g = '<path d="' + d + '" fill="none" stroke="#1C1838" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function (p, i) { var r = 14 + Math.min(10, jobs[i]._new.length * 2.2); g += '<circle cx="' + (p[0] + 3) + '" cy="' + (p[1] + 3) + '" r="' + r + '" fill="#1C1838"/><circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '" fill="' + C[R.jobs.indexOf(jobs[i]) % 6] + '" stroke="#1C1838" stroke-width="4"/>'; });
  document.getElementById("route").innerHTML = g;
</script></body></html>
