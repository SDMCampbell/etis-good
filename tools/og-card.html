<!DOCTYPE html>
<!-- Renders assets/og.png (1200x630 share card) for the Text Rain design from live data.
     Regenerate: open in a headless browser at 1200x630 and screenshot (see tools/README or loop notes). -->
<html lang="en"><head><meta charset="utf-8"><title>og card</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#050806}
  body{color:#C8F7C5;font-family:"JetBrains Mono",ui-monospace,"DejaVu Sans Mono",monospace;position:relative}
  canvas{position:absolute;inset:0}
  .txt{position:absolute;left:72px;top:96px;right:72px}
  .k{font-size:22px;color:#7DB878;margin:0 0 18px}
  h1{font-size:96px;line-height:1.02;font-weight:700;color:#EAFFE7;margin:0 0 18px;letter-spacing:.02em;text-shadow:0 0 24px rgba(57,255,122,.25)}
  .r{font-size:34px;color:#39FF7A;margin:0 0 26px}
  .s{font-size:22px;color:#C8F7C5;margin:0}
  .s b{color:#39FF7A}
  .u{position:absolute;left:72px;bottom:56px;font-size:22px;color:#8CFFB0}
  .drones{position:absolute;right:72px;bottom:52px;font-size:26px;color:#39FF7A;letter-spacing:.4em;text-shadow:0 0 10px #39FF7A}
</style></head><body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="txt"><p class="k" id="k"></p><h1 id="n"></h1><p class="r" id="r"></p><p class="s" id="s"></p></div>
<div class="u" id="u"></div>
<div class="drones" aria-hidden="true">▸ ▸ ▸ ▸</div>
<script src="../assets/resume-data.js"></script>
<script src="../assets/derive.js"></script>
<script>
  var R = RESUME, D = DERIVED;
  document.getElementById("k").textContent = "// résumé.txt · " + D.roleCount + " roles · " + D.yearsIn + "+ yrs · " + D.skillCount + " systems";
  document.getElementById("n").textContent = R.name.toUpperCase();
  document.getElementById("r").textContent = R.title + " · " + R.location;
  document.getElementById("s").innerHTML = "<b>&gt; now:</b> " + D.current.role + " @ " + D.current.company + (D.current.returning ? " · round two" : "");
  document.getElementById("u").textContent = "> etis-good.samueldcampbell.workers.dev";
  // faint glyph rain behind (seeded so the card is stable)
  var c = document.getElementById("c").getContext("2d"), seed = 7, G = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789<>/=+*#%$&{}[]~^";
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  c.font = "18px monospace"; c.textBaseline = "top";
  for (var x = 8; x < 1200; x += 24) {
    var head = rnd() * 760 - 60, len = 6 + (rnd() * 16 | 0), a = .05 + rnd() * .08, quiet = x > 50 && x < 1130 ? .55 : 1;
    for (var k = 0; k < len; k++) { var y = head - k * 22; if (y < -20 || y > 630) continue;
      c.fillStyle = "rgba(57,255,122," + (k === 0 ? a * 2.4 : a * (1 - k / len)) * quiet + ")"; c.fillText(G[(rnd() * G.length) | 0], x, y); }
  }
</script>
</body></html>
