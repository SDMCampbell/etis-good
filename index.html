  <!-- Motion: devices set to reduce motion get a full-screen notice first, and nothing else, until the visitor picks:
       play the animation anyway (remembered as motion=on) or see the page without it (remembered as motion=off).
       This mirrors swarm-intro's own preload, but with that opt-in: it keeps the page blank until the intro starts. -->
  <!-- Mode: from a #mode=NAME link, else the last one picked, else normal. Sets html[data-mode] for the background. -->
  <script>window.MODES=["normal","samurai","robot","wizard","ninja"];window.MODE=(function(){var m=(location.hash.match(/mode=(\w+)/)||[])[1];if(MODES.indexOf(m)<0){try{m=localStorage.getItem("mode")}catch(e){}}if(m==="mech")m="robot";return MODES.indexOf(m)<0?"normal":m})();document.documentElement.setAttribute("data-mode",window.MODE);</script>
  <script>window.MOTION=(function(){try{var m=localStorage.getItem("motion");if(m==="on")return true;if(m==="off")return false}catch(e){}return !matchMedia("(prefers-reduced-motion: reduce)").matches})();(function(){try{if(!window.MOTION&&localStorage.getItem("motion")!=="off")document.documentElement.classList.add("motion-gate")}catch(e){if(!window.MOTION)document.documentElement.classList.add("motion-gate")}})();(function(){try{if(!window.MOTION)return;var d=document.documentElement;d.setAttribute("data-swarm-intro","");var s=document.createElement("style");s.id="swarm-intro-preload";s.textContent="html[data-swarm-intro] body>*{opacity:0;animation:swarm-intro-failsafe 0s 4s forwards}@keyframes swarm-intro-failsafe{to{opacity:1}}";document.head.appendChild(s);}catch(e){}})();</script>

<body>

  <script src="assets/resume-data.js"></script>

  <script src="assets/matrix.js"></script>
  <script src="assets/swarm-intro.js"></script>
  <script src="assets/samurai.js"></script>
  <script src="assets/robot.js"></script>
  <script src="assets/wizard.js"></script>
  <script src="assets/ninja.js"></script>
  <script>
    // Modes: each one is a different way of using the swarm library to show the content.
    // Picked with the switch at the top right (remembered) or a link ending in #mode=NAME.
    var MODE = window.MODE;                       // worked out in <head>, so the background can match before first paint
    document.querySelectorAll(".modes [data-mode]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.mode === MODE);
      b.onclick = function () {
        // the hash carries the choice through the reload (storage isn't available everywhere, e.g. sandboxed frames)
        try { localStorage.setItem("mode", b.dataset.mode); } catch (e) {}
        // ...along with anything else in it (a fight=1 from a link)
        var rest = location.hash.replace(/^#/, "").split("&").filter(function (p) { return p && !/^mode=/.test(p); });
        location.hash = ["mode=" + b.dataset.mode].concat(rest).join("&"); location.reload();
      };
    });

    if (!window.MOTION) {
      var note = document.getElementById("motionNote"); note.hidden = false;
      document.getElementById("motionOn").onclick = function () { try { localStorage.setItem("motion", "on"); } catch (e) {} location.reload(); };
      // the still page: the notice shrinks to a one-line reminder at the top, keeping the way back to the animation
      document.getElementById("motionOff").onclick = function () { try { localStorage.setItem("motion", "off"); } catch (e) {} document.documentElement.classList.remove("motion-gate"); };
      if (document.documentElement.classList.contains("motion-gate")) document.getElementById("motionOn").focus();
    } else {
      if (MODE === "samurai") samuraiMode();
      if (MODE === "robot") robotMode();
      if (MODE === "wizard") wizardMode();
      if (MODE === "ninja") ninjaMode();
      // Swarm size: swarm-intro takes its cursor count at start-up and can't add cursors to a running build,
      // so changing the number tears the current swarm down and rebuilds the page with the new count.
      var narrow = innerWidth < 768, size = narrow ? 8 : 14, intro = null;

      // What a cursor does when it has nothing to build (the swarm now stays on screen after the page is built).
      // Each returns where to go next ({x, y} in page coordinates, ms to get there, wait before asking again),
      // or null for the library's own random wandering.
      var mouse = null, slots = new Map();
      addEventListener("pointermove", function (e) { if (e.pointerType === "mouse") mouse = { x: e.clientX, y: e.clientY }; }, { passive: true });
      document.addEventListener("mouseout", function (e) { if (!e.relatedTarget) mouse = null; });     // pointer left the window: circle the centre
      function where(a) { var v = /matrix\(([^)]+)\)/.exec(getComputedStyle(a.el).transform); if (!v) return [a.x, a.y]; v = v[1].split(","); return [+v[4], +v[5]]; }
      var lastIai = 0;                                     // samurai strikes take turns
      function slotOf(a) { if (!slots.has(a)) slots.set(a, slots.size); return slots.get(a); }
      var IDLE = {
        // normal: orbit the mouse pointer (or the middle of the screen), in two rings turning opposite ways
        normal: function (a, now) {
          var i = slotOf(a), ring = i % 2, n = Math.ceil(size / 2), k = Math.floor(i / 2);
          var c = mouse || { x: innerWidth / 2, y: innerHeight / 2 }, r = ring ? 78 : 46;
          var ang = k / n * Math.PI * 2 + now * (ring ? -.0018 : .0026);
          return { x: scrollX + c.x + Math.cos(ang) * r, y: scrollY + c.y + Math.sin(ang) * r, ms: 160, wait: 90 };
        },
        // samurai: walk to a place in a neat line down the right side of the screen and sit in meditation
        // ...and if the mouse pointer comes near one that's in its place, it strikes: an iaijutsu draw that vanishes into a cut
        // across the pointer and reappears in its place a moment later (drawn by samurai.js). Several in range take turns.
        samurai: function (a, now) {
          var i = slotOf(a), perCol = Math.max(4, Math.floor((innerHeight - 120) / 58)), col = Math.floor(i / perCol), row = i % perCol;
          var x = scrollX + innerWidth - (narrow ? 30 : 70) - col * 46, y = scrollY + 110 + row * 58;
          a.el.dataset.rest = performance.now();
          var d = Math.hypot(x - a.x, y - a.y), back = { x: x, y: y, ms: d < 2 ? 200 : Math.max(250, d * 1.6), wait: 150 };
          if (a._iaiT && now - a._iaiT < 1350) { back.state = "striking"; back.wait = 60; return back; }
          if (mouse && d < 2 && now - (a._iaiT || 0) > 1900 && now - lastIai > 380) {
            var p = where(a), mx = scrollX + mouse.x, my = scrollY + mouse.y;
            if (Math.hypot(mx - p[0], my - (p[1] - 18)) < 150) {
              a._iaiT = lastIai = now;
              a.el.dataset.iai = now; a.el.dataset.ix = mx; a.el.dataset.iy = my;
              back.state = "striking"; back.wait = 60;
            }
          }
          return back;
        },
        // robot: wander the screen as before; but any robot the mouse pointer comes near stops and fires its laser at it
        robot: function (a, now) {
          if (!mouse) return null;
          var p = where(a), mx = scrollX + mouse.x, my = scrollY + mouse.y;
          if (Math.hypot(mx - p[0], my - (p[1] - 20)) > 190) return null;          // out of range: the library's own wandering
          a.el.dataset.zap = now; a.el.dataset.zx = mx; a.el.dataset.zy = my;
          return { x: p[0], y: p[1], ms: 250, wait: 100, state: "zapping" };        // hold position and keep firing
        },
        // wizard: drift into an evenly spaced horizontal line across the screen and sit in meditation on it. The line sits
        // halfway up the screen, or level with the mouse pointer while it's on the page. The wave rolling along the line is
        // drawn by wizard.js itself (the cursors hold still), so it's perfectly smooth and the wizards stay seated.
        wizard: function (a, now) {
          var i = slotOf(a), n = Math.max(size, slots.size), m = narrow ? 24 : 60;
          var x = scrollX + m + (i + .5) / n * (innerWidth - 2 * m);
          var y = scrollY + (mouse ? Math.min(innerHeight - 30, Math.max(70, mouse.y)) : innerHeight / 2);
          var p = where(a), d = Math.hypot(x - p[0], y - p[1]), onLine = a._lineT && now - a._lineT < 400;
          if (!onLine && d > 30) { var ms = Math.min(3200, Math.max(500, d * 2.2)); return { x: x, y: y, ms: ms, wait: ms }; }   // one slow glide into place
          a._lineT = now; a.el.dataset.rest = now; a.el.dataset.line = now;     // on the line: seated, riding the wave
          return { x: x, y: y, ms: 260, wait: 90 };                               // ...and following the pointer up and down
        },
        // ninja: vanish in a puff of smoke and reappear lurking at an edge of the screen, facing in: flat against a side wall
        // with its back to it, or crouched along the bottom. Every few seconds, or the moment the mouse pointer comes near,
        // vanish again and turn up somewhere else (well away from the pointer).
        ninja: function (a, now) {
          slotOf(a);
          var w = a._nj || (a._nj = { until: 0, x: -999, y: -999 });
          var inView = w.y > scrollY + 40 && w.y < scrollY + innerHeight + 5 && w.x > scrollX && w.x < scrollX + innerWidth;
          var near = mouse && Math.hypot(w.x - scrollX - mouse.x, w.y - 12 - scrollY - mouse.y) < 90;
          if (now > w.until || !inView || near) {
            var W = innerWidth, H = innerHeight, ox = w.x, oy = w.y;
            for (var tries = 0; tries < 12; tries++) {
              var side = Math.random();
              if (side < .35) { w.x = scrollX + 6; w.y = scrollY + 120 + Math.random() * (H - 170); w.face = 1; w.wall = 1; }
              else if (side < .7) { w.x = scrollX + W - 6; w.y = scrollY + 120 + Math.random() * (H - 170); w.face = -1; w.wall = 1; }
              else { w.x = scrollX + 40 + Math.random() * (W - 80); w.y = scrollY + H - 8; w.face = w.x - scrollX < W / 2 ? 1 : -1; w.wall = 0; }
              var farFromPointer = !mouse || Math.hypot(w.x - scrollX - mouse.x, w.y - scrollY - mouse.y) > 240;
              var crowded = false; slots.forEach(function (_, b) { if (b !== a && b._nj && Math.hypot(b._nj.x - w.x, b._nj.y - w.y) < 44) crowded = true; });   // not on top of another ninja
              if (farFromPointer && !crowded && Math.hypot(w.x - ox, w.y - oy) > 150) break;
            }
            w.until = now + 4000 + Math.random() * 6000;
          }
          a.el.dataset.rest = now; a.el.dataset.face = w.face; a.el.dataset.wall = w.wall ? "1" : "";
          return { x: w.x, y: w.y, ms: 1, wait: 60 };                               // ms 1: there in an instant; checks often for the pointer
        }
      };
      try { size = Math.min(30, +localStorage.getItem("swarmSize") || size); } catch (e) {}
      var sizeBox = document.getElementById("swarmSize");
      function launch(first) {
        slots = new Map();
        if (intro) intro.destroy();
        intro = swarmIntro({ root: "#content", logo: first ? RESUME.handle : false, respectReducedMotion: false,
          cursors: size, maxCursors: Math.min(30, Math.max(size, narrow ? 14 : 24)),
          persist: true, idle: IDLE[MODE], type: typeAll ? "all" : MODE === "normal", fight: fightOn,
          // samurai build with an iaijutsu strike: crouch at the corner first, and sheathe before the element appears
          buildPause: MODE === "samurai" ? 330 : 0, revealPause: MODE === "samurai" ? 580 : 0 });   // the figure modes show text whole unless "type" is on
        document.documentElement.classList.toggle("type-all", typeAll);
        document.documentElement.classList.add("swarm-live");
        var mine = intro; intro.done.then(function () { if (intro === mine) document.documentElement.classList.remove("swarm-live"); });
      }
      // Click a piece of the page: the nearest free worker takes it apart, and after a moment another builds it again.
      // Links and controls still work as normal.
      document.getElementById("content").addEventListener("click", function (e) {
        if (!intro || !intro.rework || e.target.closest("a, button, input, select, textarea, label")) return;
        var sel = getSelection && getSelection(); if (sel && String(sel)) return;        // selecting text isn't a click
        intro.rework(e.target);
      });
      // "type" toggle: every mode types all of the text in, character by character (and deletes it backwards on a click)
      var typeAll = false, typeBox = document.getElementById("typeAll");
      try { typeAll = localStorage.getItem("typeAll") === "on"; } catch (e) {}
      typeBox.checked = typeAll;
      // "fight" toggle: half the swarm (rounded down) attacks the page, tearing elements down; the rest defend it
      // A link can turn it on or off for that visit, without changing the visitor's saved choice: ?fight=1 or #fight=1
      // (also #mode=samurai&fight=1; fight=0 turns it off). Ticking the box yourself takes over: it's saved, and the
      // fight setting comes out of the address so a reload doesn't undo it.
      function urlFight() {
        var v = new URLSearchParams(location.search).get("fight");
        if (v === null) v = (location.hash.match(/[#&]fight=([^&]*)/) || [])[1];
        return v == null ? null : /^(1|on|true|yes)$/i.test(v) ? true : /^(0|off|false|no)$/i.test(v) ? false : null;
      }
      var fightOn = urlFight(), fightBox = document.getElementById("fightOn");
      if (fightOn === null) { fightOn = false; try { fightOn = localStorage.getItem("fight") === "on"; } catch (e) {} }
      fightBox.checked = fightOn;
      fightBox.onchange = function () {
        fightOn = fightBox.checked; try { localStorage.setItem("fight", fightOn ? "on" : "off"); } catch (e) {}
        if (urlFight() !== null) {
          var q = new URLSearchParams(location.search); q.delete("fight");
          var h = location.hash.replace(/^#/, "").split("&").filter(function (p) { return p && !/^fight=/.test(p); }).join("&");
          history.replaceState(null, "", location.pathname + (String(q) ? "?" + q : "") + (h ? "#" + h : ""));
        }
        launch(false);
      };
      typeBox.onchange = function () { typeAll = typeBox.checked; try { localStorage.setItem("typeAll", typeAll ? "on" : "off"); } catch (e) {} launch(false); };
      // the swarm size: shown as a number you can click and edit. Enter (or clicking away) applies it, kept to 1-30;
      // Esc or anything that isn't a number puts the old one back. The arrow keys step it and apply at once.
      sizeBox.value = size;
      function applySize() {
        var v = Math.round(+sizeBox.value);
        if (!sizeBox.value.trim() || !isFinite(v)) { sizeBox.value = size; return; }
        v = Math.max(1, Math.min(30, v)); sizeBox.value = v;
        if (v === size) return;
        size = v; try { localStorage.setItem("swarmSize", size); } catch (e) {} launch(false);
      }
      sizeBox.onchange = applySize;
      sizeBox.onkeydown = function (e) {
        if (e.key === "Enter") { applySize(); sizeBox.blur(); }
        else if (e.key === "Escape") { e.stopPropagation(); sizeBox.value = size; sizeBox.blur(); }
      };
      sizeBox.onfocus = function () { sizeBox.select(); };
      launch(true);
    }
  </script>
