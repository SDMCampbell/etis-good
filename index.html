  <!-- Motion: devices set to reduce motion get a still page unless the visitor opts in (remembered as motion=on).
       This mirrors swarm-intro's own preload, but with that opt-in: it keeps the page blank until the intro starts. -->
  <!-- Mode: from a #mode=NAME link, else the last one picked, else normal. Sets html[data-mode] for the background. -->
  <script>window.MODES=["normal","samurai","robot"];window.MODE=(function(){var m=(location.hash.match(/mode=(\w+)/)||[])[1];if(MODES.indexOf(m)<0){try{m=localStorage.getItem("mode")}catch(e){}}if(m==="mech")m="robot";return MODES.indexOf(m)<0?"normal":m})();document.documentElement.setAttribute("data-mode",window.MODE);</script>
  <script>window.MOTION=(function(){try{var m=localStorage.getItem("motion");if(m==="on")return true;if(m==="off")return false}catch(e){}return !matchMedia("(prefers-reduced-motion: reduce)").matches})();(function(){try{if(!window.MOTION)return;var d=document.documentElement;d.setAttribute("data-swarm-intro","");var s=document.createElement("style");s.id="swarm-intro-preload";s.textContent="html[data-swarm-intro] body>*{opacity:0;animation:swarm-intro-failsafe 0s 4s forwards}@keyframes swarm-intro-failsafe{to{opacity:1}}";document.head.appendChild(s);}catch(e){}})();</script>

<body>
  <canvas id="matrix" class="matrix" aria-hidden="true"></canvas>
  <p class="motion-note" id="motionNote" hidden>animation is paused because your device is set to reduce motion · <button type="button" id="motionOn">play it anyway</button></p>
  <nav class="modes" aria-label="Display mode">mode: <button type="button" data-mode="normal">normal</button> <button type="button" data-mode="samurai">samurai</button> <button type="button" data-mode="robot">robot</button>
    <label class="swarm-size">swarm: <input type="range" id="swarmSize" min="1" max="30" step="1"> <output id="swarmSizeOut"></output></label></nav>
  <main id="content" class="content"></main>
  <noscript><p class="content">Samuel Campbell · Full Stack Web Developer · Lexington, SC · SamuelDCampbell@gmail.com</p></noscript>

  <script src="assets/resume-data.js"></script>
  <script src="assets/content.js"></script>
  <script src="assets/matrix.js"></script>
  <script src="assets/swarm-intro.js"></script>
  <script src="assets/samurai.js"></script>
  <script src="assets/robot.js"></script>
  <script>
    // Modes: each one is a different way of using the swarm library to show the content.
    // Picked with the switch at the top right (remembered) or a link ending in #mode=NAME.
    var MODE = window.MODE;                       // worked out in <head>, so the background can match before first paint
    document.querySelectorAll(".modes [data-mode]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.mode === MODE);
      b.onclick = function () {
        // the hash carries the choice through the reload (storage isn't available everywhere, e.g. sandboxed frames)
        try { localStorage.setItem("mode", b.dataset.mode); } catch (e) {}
        location.hash = "mode=" + b.dataset.mode; location.reload();
      };
    });

    if (!window.MOTION) {
      var note = document.getElementById("motionNote"); note.hidden = false;
      document.getElementById("motionOn").onclick = function () { try { localStorage.setItem("motion", "on"); } catch (e) {} location.reload(); };
    } else {
      if (MODE === "samurai") samuraiMode();
      if (MODE === "robot") robotMode();
      // Swarm size: swarm-intro takes its cursor count at start-up and can't add cursors to a running build,
      // so changing the slider tears the current swarm down and rebuilds the page with the new count.
      var narrow = innerWidth < 768, size = narrow ? 8 : 14, intro = null;

      // What a cursor does when it has nothing to build (the swarm now stays on screen after the page is built).
      // Each returns where to go next ({x, y} in page coordinates, ms to get there, wait before asking again),
      // or null for the library's own random wandering.
      var mouse = null, slots = new Map();
      addEventListener("pointermove", function (e) { if (e.pointerType === "mouse") mouse = { x: e.clientX, y: e.clientY }; }, { passive: true });
      document.addEventListener("mouseout", function (e) { if (!e.relatedTarget) mouse = null; });     // pointer left the window: circle the centre
      function slotOf(a) { if (!slots.has(a)) slots.set(a, slots.size); return slots.get(a); }
      var IDLE = {
        // normal: orbit the mouse pointer (or the middle of the screen), in two rings turning opposite ways
        normal: function (a, now) {
          var i = slotOf(a), ring = i % 2, n = Math.ceil(size / 2), k = Math.floor(i / 2);
          var c = mouse || { x: innerWidth / 2, y: innerHeight / 2 }, r = ring ? 78 : 46;
          var ang = k / n * Math.PI * 2 + now * (ring ? -.0018 : .0026);
          return { x: scrollX + c.x + Math.cos(ang) * r, y: scrollY + c.y + Math.sin(ang) * r, ms: 160, wait: 90 };
        },
        // samurai: walk to a place in a neat line down the right side of the screen and sit in meditation
        samurai: function (a) {
          var i = slotOf(a), perCol = Math.max(4, Math.floor((innerHeight - 120) / 58)), col = Math.floor(i / perCol), row = i % perCol;
          var x = scrollX + innerWidth - (narrow ? 30 : 70) - col * 46, y = scrollY + 110 + row * 58;
          a.el.dataset.rest = performance.now();
          var d = Math.hypot(x - a.x, y - a.y);
          return { x: x, y: y, ms: d < 2 ? 200 : Math.max(250, d * 1.6), wait: 150 };
        },
        // robot: wander the screen, as before
        robot: null
      };
      try { size = Math.min(30, +localStorage.getItem("swarmSize") || size); } catch (e) {}
      var slider = document.getElementById("swarmSize"), out = document.getElementById("swarmSizeOut");
      function launch(first) {
        slots = new Map();
        if (intro) intro.destroy();
        intro = swarmIntro({ root: "#content", logo: first ? RESUME.handle : false, respectReducedMotion: false,
          cursors: size, maxCursors: Math.min(30, Math.max(size, narrow ? 14 : 24)),
          persist: true, idle: IDLE[MODE] });
        document.documentElement.classList.add("swarm-live");
        var mine = intro; intro.done.then(function () { if (intro === mine) document.documentElement.classList.remove("swarm-live"); });
      }
      // Click a piece of the page: the nearest free worker takes it apart, and after a moment another builds it again.
      // Links and controls still work as normal.
      document.getElementById("content").addEventListener("click", function (e) {
        if (!intro || !intro.rework || e.target.closest("a, button, input, select, textarea, label")) return;
        var sel = getSelection && getSelection(); if (sel && String(sel)) return;        // selecting text isn't a click
        intro.rework(e.target);
      });
      slider.value = size; out.textContent = size;
      slider.oninput = function () { out.textContent = slider.value; };
      slider.onchange = function () { size = +slider.value; try { localStorage.setItem("swarmSize", size); } catch (e) {} launch(false); };
      launch(true);
    }
  </script>
</body>
