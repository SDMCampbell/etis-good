<!DOCTYPE html>
<html lang="en" data-concept="home">
<head>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samuel Campbell · Full Stack Web Developer</title>
  <meta name="description" content="Samuel Campbell, Full Stack Web Developer in Lexington, SC. A two-ink zine of his career.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23F7F2E7%27/%3E%3Ccircle cx=%2713%27 cy=%2716%27 r=%279%27 fill=%27%23FF48B0%27/%3E%3Ccircle cx=%2719%27 cy=%2716%27 r=%279%27 fill=%27%233255A4%27 style=%27mix-blend-mode:multiply%27/%3E%3C/svg%3E">

  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/zine.css">
</head>
<body>
  <header class="bar">
    <a class="who" href="#p0" id="barName">Samuel Campbell</a>
    <span class="pager mono" id="pager" aria-live="polite"></span>
    <a class="hot" id="barEmail" href="#back">Email</a>
  </header>

  <main class="zine" id="zine" tabindex="-1" aria-label="Career zine. Use the arrow keys or swipe to turn pages.">
    <section class="page cover" id="p0" aria-labelledby="name">
      <div class="sheet" id="sheet">
        <div class="layer pink" aria-hidden="false">
          <p class="mono issue" id="issue"></p>
          <h1 id="name"></h1>
          <p class="title" id="title"></p>
          <span class="dot-field" aria-hidden="true"></span>
        </div>
        <div class="layer blue" id="blue">
          <p class="now" id="now"></p>
          <p class="stats mono" id="stats"></p>
          <span class="burst" aria-hidden="true"></span>
        </div>
        <div class="squeegee" id="squeegee" role="slider" tabindex="0" aria-label="Pull the second ink. Drag right, or press Space." aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span>Pull →</span></div>
      </div>
      <p class="cover-help mono" id="coverHelp">Drag the squeegee to print the blue ink · then flip pages →</p>
    </section>
  </main>

  <nav class="turn" aria-label="Page turning">
    <button type="button" id="prev" aria-label="Previous page">←</button>
    <button type="button" id="contentsBtn" aria-expanded="false" aria-controls="contents">Contents</button>
    <button type="button" id="next" aria-label="Next page">→</button>
  </nav>
  <ol class="contents" id="contents" hidden></ol>

  <noscript><p>Samuel Campbell · <a href="mailto:SamuelDCampbell@gmail.com">SamuelDCampbell@gmail.com</a></p></noscript>

<script data-version-bar data-v="7" src="../../timeline/version-bar.js"></script>
