<!DOCTYPE html>
<html lang="en" data-concept="home">
<head>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samuel Campbell · Full Stack Web Developer</title>
  <meta name="description" content="Samuel Campbell, Full Stack Web Developer in Lexington, SC. Push the throttle through his career and watch each job install new technology.">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Samuel Campbell · Full Stack Web Developer">
  <meta property="og:description" content="Push the throttle through his career and watch each job install new technology.">
  <meta property="og:url" content="https://etis-good.samueldcampbell.workers.dev/">
  <meta property="og:image" content="https://etis-good.samueldcampbell.workers.dev/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0D1316">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%274%27 fill=%27%230D1316%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2710%27 fill=%27none%27 stroke=%27%2362D3E3%27 stroke-width=%272.5%27/%3E%3Cpath d=%27M16 16 L24 9%27 stroke=%27%23FFB547%27 stroke-width=%273%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/cockpit.css">
</head>
<body>
  <header class="brow" id="brow">
    <div class="plate">
      <span class="lbl">Pilot</span>
      <b id="pilotName">Samuel Campbell</b>
      <span class="plate-sub" id="pilotSub"></span>
    </div>
    <div class="lamps" id="lamps" aria-label="System lamps"></div>
    <div class="brow-actions">
      <button class="snd" type="button" id="sndBtn" aria-pressed="false" title="Sound (M)"><span aria-hidden="true">♪</span> <span id="sndLbl">Off</span><span class="sr"> sound</span></button>
      <button class="snd keys" type="button" id="keysBtn" aria-haspopup="dialog" title="Pilot reference (?)">?</button>
      <button class="hail" type="button" id="hailBtn" aria-haspopup="true" aria-expanded="false" aria-controls="hailPanel"><span aria-hidden="true">✉</span> Hail</button>
    </div>
    <div class="hail-panel" id="hailPanel" hidden></div>
  </header>

  <main id="cockpit" class="cockpit" aria-label="Cockpit">
    <div class="canopy" aria-hidden="true"><svg id="horizon" viewBox="0 0 1200 120" preserveAspectRatio="none"></svg></div>

    <section class="mfd mfd-l" aria-labelledby="asg-h">
      <h2 class="mfd-t" id="asg-h">Current assignment</h2>
      <div id="assignment"></div>
      <dl class="counters" id="counters"></dl>
      <svg class="frame" id="frame" viewBox="0 0 200 170" aria-hidden="true"></svg>
    </section>

    <section class="mfd mfd-c" aria-labelledby="mission-h">
      <h2 class="mfd-t" id="mission-h">Mission card</h2>
      <article class="mission" id="mission"></article>
    </section>

    <section class="mfd mfd-r" aria-labelledby="sens-h">
      <h2 class="mfd-t" id="sens-h">Sensors · systems installed</h2>
      <svg class="scope" id="scope" viewBox="-110 -110 220 220" aria-hidden="true"></svg>
      <form class="lock" id="lockForm" role="search" autocomplete="off">
        <label for="lockIn" class="lock-lbl">Lock</label>
        <input id="lockIn" type="search" placeholder="a system… e.g. PHP" list="lockList" spellcheck="false">
        <datalist id="lockList"></datalist>
      </form>
      <p class="scope-legend" id="legend" aria-live="polite"></p>
    </section>

    <div class="throttle-wrap">
      <span class="t-year mono" id="tYear" aria-hidden="true"></span>
      <div class="throttle" id="throttle">
        <div class="t-track" id="tTrack" aria-hidden="true"></div>
        <div class="t-handle" id="tHandle" role="slider" tabindex="0" aria-label="Throttle: move through Samuel's career in time"></div>
      </div>
      <span class="t-lbl mono" aria-hidden="true">Throttle</span>
    </div>

    <div class="console" aria-hidden="true"><ol id="console"></ol></div>
    <nav class="aux" aria-label="Auxiliary bays">
      <a href="terminal/">Maintenance Port</a>
      <a href="gitlog/">Flight Recorder</a>
      <a href="desktop/">Crew Deck OS</a>
      <a href="../../timeline/" id="logLink">Service Log</a>
      <a href="#record">Plain résumé</a>
      <button type="button" class="skip" id="skipBtn">Skip to full systems ▸▸</button>
    </nav>
    <div class="heat" id="heat" aria-hidden="true"><span>Heat (just for fun)</span><i id="heatBar"></i></div>
    <p class="sr" id="live" aria-live="polite"></p>
  </main>

  <section class="record" id="record" aria-labelledby="rec-h">
    <h2 id="rec-h">Pilot record <small>plain résumé</small></h2>
    <p id="recSummary"></p>
    <ol class="rec-jobs" id="recJobs"></ol>
    <h3>System bays</h3>
    <div id="bays"></div>
    <p class="rec-contact" id="recContact"></p>
  </section>

  <dialog class="ref" id="ref" aria-labelledby="ref-h">
    <div class="ref-card">
      <h2 id="ref-h">Pilot reference card <button type="button" class="ref-x" id="refClose" aria-label="Close">✕</button></h2>
      <dl id="refList"></dl>
    </div>
  </dialog>
  <noscript><p class="noscript">Samuel Campbell · Full Stack Web Developer · <a href="mailto:SamuelDCampbell@gmail.com">SamuelDCampbell@gmail.com</a> · <a href="https://github.com/SDMCampbell">GitHub</a></p></noscript>
  <script src="assets/resume-data.js"></script>
  <script src="assets/derive.js"></script>
  <script src="../../versions/manifest.js"></script>
  <script src="assets/cockpit.js"></script>
  <script src="assets/switcher.js"></script>
<script data-version-bar data-v="23" src="../../timeline/version-bar.js"></script>
</body>
</html>
