<!DOCTYPE html>
<html lang="en" data-concept="desktop">
<head>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DoogOS · Samuel Campbell</title>
  <meta name="description" content="Samuel Campbell's resume as a retro desktop operating system.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23141414%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27monospace%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23f1b51c%27%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot-logo">DoogOS</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <main class="desk" id="desk" aria-label="DoogOS desktop">
    <ul class="icons" id="icons" aria-label="Desktop icons"></ul>
    <div class="wallpaper-text" aria-hidden="true">
      <span id="wpName"></span>
      <small id="wpTitle"></small>
    </div>
  </main>

  <footer class="taskbar">
    <button class="start" id="startBtn" aria-haspopup="menu" aria-expanded="false">
      <span class="start-mark" aria-hidden="true"></span>Doog
    </button>
    <div class="tasks" id="tasks" role="toolbar" aria-label="Open windows"></div>
    <div class="tray"><span id="clock"></span></div>
  </footer>
  <div class="start-menu" id="startMenu" role="menu" hidden></div>

  <script src="../assets/resume-data.js"></script>
  <script src="desktop.js"></script>
  <script src="../assets/switcher.js"></script>
<script data-version-bar data-v="48" src="../../../timeline/version-bar.js"></script>
</body>
</html>
